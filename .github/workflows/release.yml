name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="# $VERSION" '$0==v{f=1;next} /^# /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---

          macOS-сборки подписаны ad-hoc и не нотарифицированы. После установки в «Программы» снимите карантин:

          ```sh
          xattr -dr com.apple.quarantine /Applications/maNETka.app
          ```

          Windows и Linux: coming soon, не протестировано. Можно собрать самостоятельно — см. README.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: maNETka ${{ env.VERSION }}
          body_path: notes.md
          files: |
            release/*.dmg
            release/*.zip
